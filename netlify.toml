[build]
  command = "python3 tools/build.py && mkdir -p _site && cp -r index.html css js _site/ && cp dist/hlf2.html _site/hlf2-single.html"
  publish = "_site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# 游戏是纯静态资源，长缓存 + 短 HTML 缓存
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
